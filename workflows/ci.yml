name: Auto Fix Code

on:
  push:
    branches: [ main, master ]
  # También se puede programar
  schedule:
    - cron: '0 2 * * *'  # Cada día a las 2 AM

jobs:
  autofix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Necesario para hacer push de cambios
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Auto-fix linting errors
        run: npm run lint:fix || true
        
      - name: Auto-format code
        run: npm run format || true
        
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "style: auto-fix linting and formatting"
          git push